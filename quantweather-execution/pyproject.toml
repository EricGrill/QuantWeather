[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantweather-execution"
version = "0.1.0"
description = "Starter repo for QuantWeather trade execution and portfolio state"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Eric" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
